<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenManus</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-2: #1c212a;
    --border: #262c37;
    --text: #e6e9ef;
    --muted: #8b94a6;
    --accent: #4f8cff;
    --green: #3ecf8e;
    --amber: #f5a524;
    --red: #f2555a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  button {
    font: inherit; color: inherit; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px;
  }
  button:hover { border-color: #38414f; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--red); }

  /* sidebar */
  aside {
    width: 250px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  aside header { padding: 16px; border-bottom: 1px solid var(--border); }
  aside h1 { margin: 0 0 12px; font-size: 15px; letter-spacing: .3px; }
  #sessions { flex: 1; overflow-y: auto; padding: 8px; }
  .session {
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session:hover { background: var(--panel-2); }
  .session.active { background: var(--panel-2); color: var(--text); }
  .meta { padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; line-height: 1.6; }
  .meta b { color: var(--text); font-weight: 500; }

  /* main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  main > header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  #title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.running { background: var(--green); animation: pulse 1.2s infinite; }
  .dot.error { background: var(--red); }
  .dot.question { background: var(--amber); }
  @keyframes pulse { 50% { opacity: .25; } }

  #feed { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .empty { margin: auto; text-align: center; color: var(--muted); line-height: 1.7; }
  .bubble {
    align-self: flex-end; max-width: 70%; background: var(--accent); color: #fff;
    padding: 10px 14px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; word-break: break-word;
  }
  .line {
    display: flex; gap: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .line .lvl { flex: none; width: 62px; color: var(--muted); text-transform: lowercase; }
  .line.WARNING .txt { color: var(--amber); }
  .line.ERROR .txt, .line.CRITICAL .txt { color: var(--red); }
  .card {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    background: var(--panel); white-space: pre-wrap; word-break: break-word;
  }
  .card.question { border-color: var(--amber); }
  .card.error { border-color: var(--red); color: #ffb4b7; }
  .card.result { border-color: #2c4a35; }
  .card h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }

  /* composer */
  form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }
  textarea {
    flex: 1; resize: none; height: 44px; max-height: 160px; padding: 11px 14px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  /* workspace */
  #workspace { width: 260px; flex: none; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  #workspace.hidden { display: none; }
  #workspace header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  #workspace header span { flex: 1; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  #files { flex: 1; overflow-y: auto; padding: 8px; }
  #files a { display: block; padding: 7px 8px; border-radius: 7px; color: var(--text); text-decoration: none; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files a:hover { background: var(--panel-2); }
  #files small { color: var(--muted); }
</style>
</head>
<body>
<aside>
  <header>
    <h1>🐜 OpenManus</h1>
    <button id="new-session" class="primary" style="width:100%">New session</button>
  </header>
  <div id="sessions"></div>
  <div class="meta" id="llm-meta"></div>
</aside>

<main>
  <header>
    <div id="title">No session</div>
    <div class="pill"><span class="dot" id="dot"></span><span id="state">idle</span></div>
    <button id="toggle-workspace">Files</button>
    <button id="stop" class="danger" disabled>Stop</button>
  </header>
  <div id="feed"><div class="empty">Create a session and describe your task.<br />Manus will stream every step here.</div></div>
  <form id="composer">
    <textarea id="prompt" placeholder="Describe a task…  (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
</main>

<div id="workspace" class="hidden">
  <header><span>Workspace</span><button id="refresh-files">↻</button></header>
  <div id="files"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const feed = $("feed");
let currentId = null;
let source = null;
let pendingQuestion = false;

async function api(path, options) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    throw new Error(detail.detail || response.statusText);
  }
  return response.json();
}

function atBottom() {
  return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
}

function append(node) {
  const stick = atBottom();
  const placeholder = feed.querySelector(".empty");
  if (placeholder) placeholder.remove();
  feed.appendChild(node);
  if (stick) feed.scrollTop = feed.scrollHeight;
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function setState(state) {
  $("state").textContent = state;
  $("dot").className = "dot " + (state === "idle" ? "" : state);
  $("stop").disabled = state !== "running";
}

function render(event) {
  if (event.type === "log") {
    const line = element("div", "line " + event.level);
    line.appendChild(element("span", "lvl", event.level));
    line.appendChild(element("span", "txt", event.message));
    append(line);
  } else if (event.type === "user" || event.type === "answer") {
    append(element("div", "bubble", event.message));
  } else if (event.type === "question") {
    pendingQuestion = true;
    setState("question");
    const card = element("div", "card question");
    card.appendChild(element("h4", null, "Manus asks"));
    card.appendChild(element("div", null, event.message));
    append(card);
    $("prompt").placeholder = "Answer the agent…";
    $("prompt").focus();
  } else if (event.type === "result") {
    const card = element("div", "card result");
    card.appendChild(element("h4", null, "Run finished"));
    card.appendChild(element("div", null, event.message));
    append(card);
    loadFiles();
  } else if (event.type === "error") {
    const card = element("div", "card error");
    card.appendChild(element("h4", null, "Error"));
    card.appendChild(element("div", null, event.message));
    append(card);
  } else if (event.type === "status") {
    if (event.state !== "question") pendingQuestion = false;
    if (event.state !== "running") $("prompt").placeholder = "Describe a task…";
    setState(event.state === "stopped" ? "idle" : event.state);
  }
}

function connect(sessionId) {
  if (source) source.close();
  feed.innerHTML = "";
  source = new EventSource(`/api/sessions/${sessionId}/events`);
  source.onmessage = (message) => render(JSON.parse(message.data));
  source.onerror = () => setState("error");
}

async function selectSession(sessionId) {
  currentId = sessionId;
  localStorage.setItem("openmanus.session", sessionId);
  const info = await api(`/api/sessions/${sessionId}`);
  $("title").textContent = info.title;
  setState(info.state);
  pendingQuestion = Boolean(info.pending_question);
  connect(sessionId);
  await loadSessions();
}

async function loadSessions() {
  const { sessions } = await api("/api/sessions");
  const list = $("sessions");
  list.innerHTML = "";
  sessions.forEach((info) => {
    const item = element("div", "session" + (info.id === currentId ? " active" : ""), info.title);
    item.title = info.title;
    item.onclick = () => selectSession(info.id);
    list.appendChild(item);
  });
}

async function loadFiles() {
  const { files } = await api("/api/workspace");
  const list = $("files");
  list.innerHTML = "";
  if (!files.length) {
    list.appendChild(element("div", "meta", "No files yet."));
    return;
  }
  files.forEach((file) => {
    const link = document.createElement("a");
    link.href = `/api/workspace/file?path=${encodeURIComponent(file.path)}`;
    link.target = "_blank";
    link.textContent = file.path;
    link.appendChild(document.createElement("br"));
    link.appendChild(element("small", null, `${(file.size / 1024).toFixed(1)} KB`));
    list.appendChild(link);
  });
}

$("new-session").onclick = async () => {
  const info = await api("/api/sessions", { method: "POST" });
  await selectSession(info.id);
};

$("stop").onclick = async () => {
  await api(`/api/sessions/${currentId}/stop`, { method: "POST" });
};

$("toggle-workspace").onclick = () => {
  $("workspace").classList.toggle("hidden");
  if (!$("workspace").classList.contains("hidden")) loadFiles();
};

$("refresh-files").onclick = loadFiles;

$("composer").onsubmit = async (event) => {
  event.preventDefault();
  const input = $("prompt");
  const prompt = input.value.trim();
  if (!prompt) return;
  if (!currentId) {
    const info = await api("/api/sessions", { method: "POST" });
    await selectSession(info.id);
  }
  input.value = "";
  input.style.height = "44px";
  try {
    const info = await api(`/api/sessions/${currentId}/messages`, {
      method: "POST",
      body: JSON.stringify({ prompt }),
    });
    $("title").textContent = info.title;
    await loadSessions();
  } catch (error) {
    render({ type: "error", message: error.message });
  }
};

$("prompt").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});

$("prompt").addEventListener("input", (event) => {
  event.target.style.height = "44px";
  event.target.style.height = Math.min(event.target.scrollHeight, 160) + "px";
});

(async function start() {
  const { llm, workspace } = await api("/api/config");
  $("llm-meta").innerHTML =
    `<b>${llm.model || "?"}</b><br />${llm.api_type || ""} · ${llm.base_url || ""}<br />${workspace}`;
  const { sessions } = await api("/api/sessions");
  const saved = localStorage.getItem("openmanus.session");
  const existing = sessions.find((info) => info.id === saved) || sessions[0];
  if (existing) await selectSession(existing.id);
  else await loadSessions();
})();
</script>
</body>
</html>
