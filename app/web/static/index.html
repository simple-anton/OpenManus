<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenManus</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --rail: #faf9f6;
    --line: #e5e2da;
    --ink: #23221f;
    --muted: #85817a;
    --accent: #2f6feb;
    --accent-soft: #eaf0fe;
    --green: #1f9d55;
    --red: #d13b3b;
    --code-bg: #1e1e1c;
    --code-ink: #e8e6e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--ink); font-size: 14px; }
  button { font: inherit; color: inherit; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; }
  button:hover { border-color: #cfcbc1; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { background: transparent; border-color: transparent; }
  button.ghost:hover { background: #efece5; }

  /* left rail */
  aside { width: 244px; flex: none; display: flex; flex-direction: column; background: var(--rail); border-right: 1px solid var(--line); }
  aside header { padding: 14px 14px 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 12px; }
  .brand span.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  #tasks { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .task { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 8px; cursor: pointer; color: #4c4a45; }
  .task:hover { background: #efece5; }
  .task.active { background: #e8e4db; color: var(--ink); }
  .task .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .state { width: 7px; height: 7px; border-radius: 50%; background: #c8c4ba; flex: none; }
  .task .state.running { background: var(--green); animation: pulse 1.2s infinite; }
  .task .state.error { background: var(--red); }
  .meta { padding: 12px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; line-height: 1.6; }
  .meta b { color: var(--ink); font-weight: 600; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* centre column */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  main > header { display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .switch button { border: 0; border-radius: 0; padding: 5px 12px; background: transparent; color: var(--muted); }
  .switch button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #progress { color: var(--muted); font-size: 12.5px; white-space: nowrap; }

  #feed { flex: 1; overflow-y: auto; padding: 22px 26px 8px; }
  .stack { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .empty { margin-top: 22vh; text-align: center; color: var(--muted); line-height: 1.8; }
  .empty h2 { color: var(--ink); font-size: 19px; margin: 0 0 6px; }
  .bubble { align-self: flex-end; max-width: 82%; background: var(--accent); color: #fff; padding: 9px 13px; border-radius: 13px 13px 3px 13px; white-space: pre-wrap; word-break: break-word; }
  .agent { display: flex; gap: 10px; }
  .avatar { width: 26px; height: 26px; flex: none; border-radius: 7px; background: #23221f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .agent .body { flex: 1; min-width: 0; line-height: 1.6; }
  .agent .body > *:first-child { margin-top: 0; }
  .agent .body > *:last-child { margin-bottom: 0; }
  .agent .body pre { background: var(--code-bg); color: var(--code-ink); padding: 11px 13px; border-radius: 9px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; }
  .agent .body code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .agent .body :not(pre) > code { background: #ece9e2; padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
  .agent .body h1, .agent .body h2, .agent .body h3 { font-size: 15px; margin: 14px 0 6px; }
  .agent .body ul, .agent .body ol { margin: 6px 0; padding-left: 20px; }

  .tool { display: flex; align-items: center; gap: 9px; align-self: flex-start; max-width: 100%; padding: 7px 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
  .tool:hover { border-color: #c9c5bb; }
  .tool .icon { width: 20px; text-align: center; }
  .tool .name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .tool .hint { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 380px; }
  .tool .spin { width: 11px; height: 11px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  .tool.failed { border-color: #f0c4c4; background: #fdf4f4; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card { border: 1px solid var(--line); background: var(--panel); border-radius: 11px; padding: 12px 14px; }
  .card h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .7px; text-transform: uppercase; color: var(--muted); }
  .card.question { border-color: #ecd9a6; background: #fdf9ee; }
  .card.result { border-color: #c9e3d0; background: #f4faf5; }
  .card.error { border-color: #f0c4c4; background: #fdf4f4; color: #8f2b2b; }
  .card .text { white-space: pre-wrap; word-break: break-word; }
  .card details { margin-top: 9px; }
  .card summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .card details pre.block { margin: 9px 0 0; max-height: 260px; overflow: auto; }

  form { padding: 12px 26px 18px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 9px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 8px 8px 8px 14px; }
  textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; font: inherit; height: 24px; max-height: 180px; padding: 4px 0; line-height: 1.5; }
  .hint { max-width: 760px; margin: 6px auto 0; color: var(--muted); font-size: 11.5px; }

  /* right panel */
  #computer { width: 46%; min-width: 360px; max-width: 680px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
  #computer.hidden { display: none; }
  #computer > header { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  #computer h3 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; }
  .tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { padding: 5px 10px; font-size: 12.5px; color: var(--muted); border-color: transparent; background: transparent; white-space: nowrap; }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  #view { flex: 1; overflow: auto; padding: 14px; }
  #view .placeholder { color: var(--muted); text-align: center; margin-top: 30%; line-height: 1.7; }
  .viewhead { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font-size: 12.5px; color: var(--muted); }
  .viewhead .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  pre.block { background: var(--code-bg); color: var(--code-ink); padding: 12px 14px; border-radius: 9px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; }
  pre.block.out { background: #f3f1ec; color: var(--ink); border: 1px solid var(--line); }
  pre.block .cmd { color: #7fd18c; }
  .shot { max-width: 100%; max-height: 68vh; border: 1px solid var(--line); border-radius: 9px; display: block; margin-bottom: 12px; }
  .files a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 9px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 12.5px; }
  .files a:hover { background: #f2efe9; }
  .files small { color: var(--muted); flex: none; }
  .viewhead a { color: var(--accent); font-size: 12px; margin-left: auto; }
  .viewhead button { padding: 3px 8px; font-size: 12px; }
  #timeline { border-top: 1px solid var(--line); padding: 8px 10px; display: flex; gap: 6px; overflow-x: auto; align-items: center; min-height: 42px; }
  #timeline .step { flex: none; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; font-size: 11.5px; cursor: pointer; color: var(--muted); background: var(--panel); white-space: nowrap; }
  #timeline .step.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  #timeline .step.failed { border-color: #f0c4c4; color: var(--red); }
  .live { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); flex: none; }
</style>
</head>
<body>

<aside>
  <header>
    <div class="brand"><span class="dot"></span> OpenManus</div>
    <button id="new-task" class="primary" style="width:100%">Новая задача</button>
  </header>
  <div id="tasks"></div>
  <div class="meta" id="model-meta"></div>
</aside>

<main>
  <header>
    <div id="title">Нет активной задачи</div>
    <div class="switch">
      <button id="mode-agent" class="on">Агент</button>
      <button id="mode-chat">Чат</button>
    </div>
    <span id="progress"></span>
    <button id="stop" disabled>Стоп</button>
    <button id="toggle-computer" class="ghost" title="Показать или скрыть панель">&#9707;</button>
  </header>

  <div id="feed">
    <div class="stack" id="stack">
      <div class="empty">
        <h2>Опишите задачу</h2>
        Агент разобьёт её на шаги и выполнит.<br />
        Справа видно, что он делает прямо сейчас.
      </div>
    </div>
  </div>

  <form id="composer-form">
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="Что нужно сделать?"></textarea>
      <button class="primary" type="submit">Отправить</button>
    </div>
    <div class="hint" id="hint">Enter — отправить, Shift+Enter — перенос строки</div>
  </form>
</main>

<section id="computer">
  <header>
    <h3>Компьютер агента</h3>
    <span class="live"><input type="checkbox" id="follow" checked /> следить</span>
    <button class="ghost" id="refresh-files" title="Обновить файлы">&#8635;</button>
  </header>
  <div class="tabs">
    <button data-tab="terminal" class="on">Терминал</button>
    <button data-tab="editor">Редактор</button>
    <button data-tab="browser">Браузер</button>
    <button data-tab="files">Файлы</button>
    <button data-tab="model">Модель</button>
    <button data-tab="logs">Логи</button>
  </div>
  <div id="view"><div class="placeholder">Здесь появится то,<br />что делает агент</div></div>
  <div id="timeline"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const feed = $("feed"), stack = $("stack"), view = $("view"), timeline = $("timeline");

let currentId = null, source = null, mode = "agent";
let steps = [], activeStep = -1, tab = "terminal", logs = [], files = [];
let exchanges = [], preview = null;

const ICONS = {
  python_execute: "\u{1F40D}", str_replace_editor: "\u{1F4DD}", ask_human: "\u{1F4AC}",
  terminate: "\u{1F3C1}", web_search: "\u{1F50E}", browser_exec: "\u{1F310}",
  browser_screenshot: "\u{1F4F8}", bash: "\u{2328}",
};
const icon = (name) => ICONS[name] || (name.startsWith("browser") ? "\u{1F310}" : "\u{1F527}");

/* which panel tab a tool belongs to */
function tabFor(step) {
  if (step.image || step.name.startsWith("browser")) return "browser";
  if (step.name === "str_replace_editor") return "editor";
  return "terminal";
}

async function api(path, options) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    throw new Error(detail.detail || response.statusText);
  }
  return response.json();
}

/* ---------------------------------------------------------- markdown */
function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function markdown(text) {
  const blocks = [];
  let html = escapeHtml(text).replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
    blocks.push("<pre><code>" + code.replace(/\n$/, "") + "</code></pre>");
    return "␀" + (blocks.length - 1) + "␀";
  });
  html = html
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/^###\s+(.+)$/gm, "<h3>$1</h3>")
    .replace(/^##\s+(.+)$/gm, "<h2>$1</h2>")
    .replace(/^#\s+(.+)$/gm, "<h1>$1</h1>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/(?:^[-*]\s+.+\n?)+/gm, (match) => {
    const items = match.trim().split("\n").map((line) => "<li>" + line.replace(/^[-*]\s+/, "") + "</li>").join("");
    return "<ul>" + items + "</ul>";
  });
  html = html.split(/\n{2,}/).map((part) => {
    const trimmed = part.trim();
    if (!trimmed) return "";
    if (/^(<h\d|<ul|<ol|<pre|␀)/.test(trimmed)) return trimmed;
    return "<p>" + trimmed.replace(/\n/g, "<br />") + "</p>";
  }).join("");
  return html.replace(/␀(\d+)␀/g, (match, index) => blocks[Number(index)]);
}

/* -------------------------------------------------------------- chat */
function atBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90; }

function append(node) {
  const stick = atBottom();
  const placeholder = stack.querySelector(".empty");
  if (placeholder) placeholder.remove();
  stack.appendChild(node);
  if (stick) feed.scrollTop = feed.scrollHeight;
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function card(kind, heading, text) {
  const node = element("div", "card " + kind);
  node.appendChild(element("h4", null, heading));
  node.appendChild(element("div", "text", text));
  return node;
}

function agentBlock(text) {
  const row = element("div", "agent");
  row.appendChild(element("div", "avatar", "M"));
  const body = element("div", "body");
  body.innerHTML = markdown(text);
  row.appendChild(body);
  return row;
}

function shortArgs(step) {
  const args = step.args || {};
  const value = args.code || args.path || args.query || args.url || args.inquire ||
    args.command || args.script || Object.values(args)[0] || "";
  return String(value).replace(/\s+/g, " ").slice(0, 90);
}

function toolRow(step) {
  const row = element("div", "tool");
  row.dataset.callId = step.call_id;
  row.appendChild(element("span", "icon", icon(step.name)));
  row.appendChild(element("span", "name", step.name));
  row.appendChild(element("span", "hint", shortArgs(step)));
  row.appendChild(element("span", "spin"));
  row.onclick = () => { $("follow").checked = false; select(steps.indexOf(step)); };
  return row;
}

/* ------------------------------------------------------- right panel */
function setTab(name, silent) {
  tab = name;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  if (!silent) renderView();
}

function select(index) {
  if (index < 0 || index >= steps.length) return;
  activeStep = index;
  setTab(tabFor(steps[index]), true);
  renderView();
  renderTimeline();
}

function imageSrc(data) {
  const type = data.startsWith("/9j/") ? "jpeg" : "png";
  return "data:image/" + type + ";base64," + data;
}

function renderView() {
  view.innerHTML = "";
  if (tab === "files") return renderFiles();
  if (tab === "model") return renderModel();
  if (tab === "logs") {
    view.appendChild(element("pre", "block out", logs.slice(-400).join("\n") || "Пока пусто"));
    return;
  }
  const step = steps[activeStep];
  if (!step) {
    view.innerHTML = '<div class="placeholder">Здесь появится то,<br />что делает агент</div>';
    return;
  }
  const head = element("div", "viewhead");
  head.appendChild(element("span", null, icon(step.name) + " " + step.name));
  const detail = step.args && (step.args.path || step.args.url || step.args.query);
  if (detail) head.appendChild(element("span", "path", String(detail)));
  view.appendChild(head);

  if (tab === "browser") {
    if (step.image) {
      const img = document.createElement("img");
      img.className = "shot";
      img.src = imageSrc(step.image);
      view.appendChild(img);
    } else if (step.image_dropped) {
      view.appendChild(element("pre", "block out", "Снимок экрана этого шага уже вытеснен из памяти."));
    }
    if (step.args && Object.keys(step.args).length) {
      view.appendChild(element("pre", "block", JSON.stringify(step.args, null, 2)));
    }
    if (step.output) view.appendChild(element("pre", "block out", step.output));
    return;
  }

  if (tab === "editor") {
    const args = step.args || {};
    const content = args.file_text || args.new_str || args.old_str || "";
    if (content) view.appendChild(element("pre", "block", content));
    if (step.output) view.appendChild(element("pre", "block out", step.output));
    return;
  }

  const args = step.args || {};
  const command = args.code || args.script || args.command || JSON.stringify(args, null, 2);
  const pre = element("pre", "block");
  pre.appendChild(element("span", "cmd", "$ "));
  pre.appendChild(document.createTextNode(String(command)));
  view.appendChild(pre);
  view.appendChild(element("pre", "block out", step.output || (step.done ? "(без вывода)" : "выполняется…")));
}

function renderTimeline() {
  timeline.innerHTML = "";
  steps.forEach((step, index) => {
    const chip = element("button",
      "step" + (index === activeStep ? " on" : "") + (step.failed ? " failed" : ""),
      (index + 1) + ". " + step.name);
    chip.onclick = () => { $("follow").checked = false; select(index); };
    timeline.appendChild(chip);
  });
  const active = timeline.children[activeStep];
  if (active) active.scrollIntoView({ inline: "nearest", block: "nearest" });
}

function fileUrl(endpoint, path) {
  return "/api/workspace/" + endpoint + "?path=" + encodeURIComponent(path) +
    (currentId ? "&session=" + currentId : "");
}

function renderFiles() {
  if (preview) return renderPreview();
  const box = element("div", "files");
  if (!files.length) box.appendChild(element("div", "placeholder", "Файлов пока нет"));
  files.forEach((file) => {
    const row = document.createElement("a");
    row.href = "#";
    row.onclick = (event) => { event.preventDefault(); openPreview(file.path); };
    row.appendChild(element("span", null, file.path));
    row.appendChild(element("small", null, (file.size / 1024).toFixed(1) + " КБ"));
    box.appendChild(row);
  });
  view.appendChild(box);
}

async function openPreview(path) {
  try {
    preview = { path: path, ...(await api(fileUrl("preview", path))) };
  } catch (error) {
    preview = { path: path, kind: "error", content: error.message };
  }
  setTab("files");
}

function renderPreview() {
  const head = element("div", "viewhead");
  const back = element("button", "ghost", "← к списку");
  back.onclick = () => { preview = null; renderView(); };
  head.appendChild(back);
  head.appendChild(element("span", "path", preview.path));
  const download = document.createElement("a");
  download.href = fileUrl("file", preview.path);
  download.target = "_blank";
  download.textContent = "скачать";
  head.appendChild(download);
  view.appendChild(head);

  if (preview.kind === "image") {
    const img = document.createElement("img");
    img.className = "shot";
    img.src = preview.data_url;
    view.appendChild(img);
  } else if (preview.kind === "text") {
    view.appendChild(element("pre", "block out", preview.content));
    if (preview.truncated) view.appendChild(element("div", "placeholder", "Показано начало файла"));
  } else if (preview.kind === "error") {
    view.appendChild(element("pre", "block out", preview.content));
  } else {
    view.appendChild(element("div", "placeholder", "Двоичный файл — его можно только скачать"));
  }
}

function renderModel() {
  if (!exchanges.length) {
    view.innerHTML = '<div class="placeholder">Здесь будет видно,<br />что уходит в модель и что она отвечает</div>';
    return;
  }
  const last = exchanges[exchanges.length - 1];
  view.appendChild(element("div", "viewhead", "Последний обмен с моделью, всего обменов: " + exchanges.length));
  last.forEach((message) => {
    const label = element("div", "viewhead", message.role + (message.tools ? " → " + message.tools.join(", ") : ""));
    view.appendChild(label);
    view.appendChild(element("pre", message.role === "assistant" ? "block" : "block out",
      message.content || "(пусто)"));
  });
}

async function loadFiles() {
  const data = await api("/api/workspace" + (currentId ? "?session=" + currentId : ""));
  files = data.files;
  if (tab === "files" && !preview) renderView();
}

/* ------------------------------------------------------------ events */
function setState(state) {
  $("stop").disabled = state !== "running";
  if (state !== "running") $("progress").textContent = "";
}

function render(event) {
  switch (event.type) {
    case "user":
    case "answer":
      append(element("div", "bubble", event.message));
      break;
    case "queued":
      append(card("", "В очереди", event.message + "\n\nБудет отправлено, когда агент закончит текущую задачу."));
      break;
    case "thought":
    case "chat":
      if ((event.text || "").trim()) append(agentBlock(event.text));
      break;
    case "step":
      $("progress").textContent = "Шаг " + event.index + " / " + event.total;
      break;
    case "tool_start": {
      const step = { call_id: event.call_id, name: event.name, args: event.args, done: false };
      steps.push(step);
      append(toolRow(step));
      if ($("follow").checked) select(steps.length - 1); else renderTimeline();
      break;
    }
    case "tool_end": {
      let step = steps.find((item) => item.call_id === event.call_id);
      if (!step) {
        step = { call_id: event.call_id, name: event.name, args: event.args };
        steps.push(step);
      }
      Object.assign(step, {
        output: event.output, image: event.image, image_dropped: event.image_dropped,
        failed: event.failed, done: true,
      });
      const row = stack.querySelector('.tool[data-call-id="' + CSS.escape(event.call_id) + '"]');
      if (row) {
        const spinner = row.querySelector(".spin");
        if (spinner) spinner.remove();
        row.classList.toggle("failed", Boolean(event.failed));
        row.appendChild(element("span", "icon", event.failed ? "✕" : "✓"));
      }
      if ($("follow").checked) select(steps.length - 1); else renderTimeline();
      if (step.name === "str_replace_editor" || step.name === "python_execute") loadFiles();
      break;
    }
    case "question":
      append(card("question", "Агент спрашивает", event.message));
      $("prompt").placeholder = "Ответьте агенту…";
      $("prompt").focus();
      break;
    case "result": {
      const done = element("div", "card result");
      done.appendChild(element("h4", null, "Задача завершена"));
      done.appendChild(element("div", "text", "Агент выполнил шагов: " + steps.length));
      const details = document.createElement("details");
      details.appendChild(element("summary", null, "Журнал шагов"));
      details.appendChild(element("pre", "block out", event.message));
      done.appendChild(details);
      append(done);
      loadFiles();
      break;
    }
    case "error":
      append(card("error", "Ошибка", event.message));
      break;
    case "llm":
      exchanges.push(event.exchange);
      if (exchanges.length > 40) exchanges.shift();
      if (tab === "model") renderView();
      break;
    case "log":
      logs.push(event.level.padEnd(8) + " " + event.message);
      if (tab === "logs") renderView();
      break;
    case "status":
      if (event.state !== "running") $("prompt").placeholder = "Что нужно сделать?";
      setState(event.state);
      loadTasks();
      break;
  }
}

function connect(sessionId) {
  if (source) source.close();
  stack.innerHTML = "";
  steps = []; activeStep = -1; logs = []; exchanges = []; preview = null; timeline.innerHTML = "";
  renderView();
  source = new EventSource("/api/sessions/" + sessionId + "/events");
  source.onmessage = (message) => render(JSON.parse(message.data));
}

async function selectTask(sessionId) {
  currentId = sessionId;
  localStorage.setItem("openmanus.session", sessionId);
  const info = await api("/api/sessions/" + sessionId);
  $("title").textContent = info.title;
  setState(info.state);
  connect(sessionId);
  await loadTasks();
  await loadFiles();
}

async function loadTasks() {
  const { sessions } = await api("/api/sessions");
  const list = $("tasks");
  list.innerHTML = "";
  sessions.forEach((info) => {
    const row = element("div", "task" + (info.id === currentId ? " active" : ""));
    row.appendChild(element("span", "state " + (info.state === "idle" ? "" : info.state)));
    row.appendChild(element("span", "label", info.title));
    row.title = info.title;
    row.onclick = () => selectTask(info.id);
    list.appendChild(row);
  });
}

/* --------------------------------------------------------- interface */
$("new-task").onclick = async () => {
  const info = await api("/api/sessions", { method: "POST" });
  await selectTask(info.id);
};
$("stop").onclick = () => api("/api/sessions/" + currentId + "/stop", { method: "POST" });
$("toggle-computer").onclick = () => $("computer").classList.toggle("hidden");
$("refresh-files").onclick = loadFiles;
$("follow").onchange = (event) => { if (event.target.checked) select(steps.length - 1); };
document.querySelectorAll(".tabs button").forEach((button) => {
  button.onclick = () => setTab(button.dataset.tab);
});
$("mode-agent").onclick = () => setMode("agent");
$("mode-chat").onclick = () => setMode("chat");

function setMode(value) {
  mode = value;
  $("mode-agent").classList.toggle("on", value === "agent");
  $("mode-chat").classList.toggle("on", value === "chat");
  $("hint").textContent = value === "agent"
    ? "Enter — отправить, Shift+Enter — перенос строки"
    : "Режим чата: модель отвечает сразу, без инструментов и файлов";
}

$("composer-form").onsubmit = async (event) => {
  event.preventDefault();
  const input = $("prompt");
  const prompt = input.value.trim();
  if (!prompt) return;
  if (!currentId) {
    const info = await api("/api/sessions", { method: "POST" });
    await selectTask(info.id);
  }
  input.value = "";
  input.style.height = "24px";
  try {
    const info = await api("/api/sessions/" + currentId + "/messages", {
      method: "POST",
      body: JSON.stringify({ prompt: prompt, mode: mode }),
    });
    $("title").textContent = info.title;
    await loadTasks();
  } catch (error) {
    append(card("error", "Ошибка", error.message));
  }
};

$("prompt").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer-form").requestSubmit();
  }
});
$("prompt").addEventListener("input", (event) => {
  event.target.style.height = "24px";
  event.target.style.height = Math.min(event.target.scrollHeight, 180) + "px";
});

(async function start() {
  const config = await api("/api/config");
  $("model-meta").innerHTML = "<b>" + (config.llm.model || "?") + "</b><br />" +
    (config.llm.base_url || "") + "<br />" + config.workspace;
  const { sessions } = await api("/api/sessions");
  const saved = localStorage.getItem("openmanus.session");
  const existing = sessions.find((info) => info.id === saved) || sessions[0];
  if (existing) await selectTask(existing.id);
  else await loadTasks();
  await loadFiles();
})();
</script>
